services:
  node1:
    build: .
    command: ["-id=1", "-listen=:7001", "-metrics=:9001", "-data-dir=/data", "-peers=1=node1:7001,2=node2:7002,3=node3:7003"]
    ports: ["7001:7001", "9001:9001"]
    volumes: ["node1-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9001/healthz"]
      interval: 2s
      timeout: 1s
      retries: 10

  node2:
    build: .
    command: ["-id=2", "-listen=:7002", "-metrics=:9002", "-data-dir=/data", "-peers=1=node1:7001,2=node2:7002,3=node3:7003"]
    ports: ["7002:7002", "9002:9002"]
    volumes: ["node2-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9002/healthz"]
      interval: 2s
      timeout: 1s
      retries: 10

  node3:
    build: .
    command: ["-id=3", "-listen=:7003", "-metrics=:9003", "-data-dir=/data", "-peers=1=node1:7001,2=node2:7002,3=node3:7003"]
    ports: ["7003:7003", "9003:9003"]
    volumes: ["node3-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9003/healthz"]
      interval: 2s
      timeout: 1s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      node1: {condition: service_healthy}
      node2: {condition: service_healthy}
      node3: {condition: service_healthy}

  grafana:
    image: grafana/grafana:11.5.2
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  node1-data:
  node2-data:
  node3-data:
